{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="fish-list-container">
    <h1 class="page-title">Все виды рыб</h1>

    <div class="fish-grid">
        {% for fish in fishes %}
        <div class="fish-card">
            <img src="{% if fish.image %}{{ fish.image.url }}{% else %}{% static 'images/default-fish.png' %}{% endif %}"
                alt="{{ fish.name }}">
            <div class="fish-card-content">
                <h2>{{ fish.name }}</h2>
                {% if fish.description %}
                    <p>{{ fish.description|truncatewords:15 }}</p>
                {% endif %}
                <a href="{% url 'fish_detail' fish.id %}" class="btn">Подробнее</a>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Кнопка "На главную" -->
    <a href="{% url 'index' %}" class="btn btn-back">На главную</a>
</div>
{% endblock %}
